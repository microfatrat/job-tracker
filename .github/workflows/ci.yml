name: CI

on:
  push:
  pull_request:

jobs:
  windows:
    name: Windows (MSVC)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Check
        run: cargo check --all-targets
      - name: Test
        run: cargo test --all-targets
      - name: Build (debug)
        run: cargo build

  linux:
    name: Linux (X11/Wayland)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libvulkan-dev mesa-vulkan-drivers \
            libfontconfig1 libfreetype6 libfontconfig1-dev libfreetype6-dev \
            libwayland-client0 \
            libxcb1 libx11-xcb1 libxshmfence1
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Check
        run: cargo check --all-targets
      - name: Test
        run: cargo test --all-targets
      - name: Headless report smoke test
        run: cargo run --no-default-features -- --seed && cargo run --no-default-features -- --report

  macos:
    name: macOS (Metal)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check
        run: cargo check --all-targets
      - name: Test
        run: cargo test --all-targets
      - name: Build release
        run: cargo build --release
      - name: Package smoke test
        run: ./scripts/package-macos.sh --skip-build --no-dmg
